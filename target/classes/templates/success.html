<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Admission Success</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{

    width:500px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h1{
    color:green;
    text-align:center;
}

h2{
    color:#333;
}

a{

    text-decoration:none;
    color:white;
    background:#007bff;
    padding:10px 20px;
    border-radius:5px;
}

a:hover{

    background:#0056b3;
}

</style>

</head>

<body>

<div class="container">

<h1>Admission Successful</h1>

<h2>
Student Name :
<span th:text="${student.studentName}"></span>
</h2>

<h2>
Roll Number :
<span th:text="${student.rollNumber}"></span>
</h2>

<h2>
Course :
<span th:text="${student.course}"></span>
</h2>

<br>

<a th:href="@{/}">
Back to Home
</a>

</div>

</body>
</html>
